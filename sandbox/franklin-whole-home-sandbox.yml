credentials:
  model: cp / ck credential pair exchanged for a token at POST /api-common/tokenizer
  onboarding: FleetView single sign-on - installers sign in with their existing FleetView account (https://energy.franklinwh.com/)
    and the portal applies the associated device scope.
  note: The portal pre-fills demo cp/ck values in the debug console. Those values are deliberately not recorded
    here.
