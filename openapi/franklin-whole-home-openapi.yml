openapi: 3.1.0
info:
  title: FranklinWH API
  version: '1.0'
  summary: Partner API for the FranklinWH (Franklin Whole Home) residential energy storage platform.
  description: 'Machine-readable rendering of the FranklinWH partner API as published by FranklinWH''s own API portal at https://api.franklinwh.com/
    (portal title `FWH-API-Service`, author `FWH`, version 1.0). The portal ships its complete operation catalogue - paths,
    HTTP methods, parameter names, locations, types, requirement flags and value notes - as a static, publicly retrievable
    JavaScript module; this OpenAPI document is a faithful format conversion of that catalogue. Nothing has been added that
    the portal does not publish. Response payload schemas are NOT published by the portal, so only the observed response envelope
    is modelled here.


    The API covers site and device inventory, telemetry and energy data, warnings and backup events, time-of-use profiles,
    smart-circuit and grid-event control, aPower battery start/stop, device grouping and an operation audit log, plus a Sunrun-specific
    namespace (`/api-sunrun/`).


    Authentication: POST /api-common/tokenizer with a `cp` / `ck` credential pair returns a token that is sent on every other
    operation in the `Authorization` header.


    Base URL: the only base URL FranklinWH publishes publicly is the free test environment, https://test-api.franklinwh.com.
    The production base URL is issued to authorised partners during onboarding and is not published.'
  contact:
    name: FranklinWH Support
    email: service@franklinwh.com
    url: https://www.franklinwh.com/support/contact/
  x-provenance:
    method: derived
    source: https://api.franklinwh.com/js/apiList-eQeWKe2I.js
    source_portal: https://api.franklinwh.com/
    derived: '2026-08-16'
    note: Converted from the FranklinWH API portal's own published operation catalogue. Operations, parameters and request
      examples are verbatim from that catalogue; no operation, parameter or schema was invented.
servers:
- url: https://test-api.franklinwh.com
  description: Free test environment - the only base URL FranklinWH publishes publicly (portal `host` / `basePath`).
tags:
- name: Authentication
  description: Token issuance for the FranklinWH partner API.
- name: Sites
  description: Site records — query, list, modify and delete.
- name: Devices
  description: Device inventory, device information and device parameters.
- name: Device Data
  description: Power, energy, telemetry, inventory and historical load data.
- name: Warnings and Events
  description: Historical device warnings and backup (outage) events.
- name: System Settings
  description: Time-of-use profiles, aPower switch control and smart-circuit settings.
- name: Grid Events
  description: Grid-event scheduling and query.
- name: Groups
  description: Device grouping and bulk settings applied by group.
- name: Modification Records
  description: Audit log of setting changes.
- name: Sunrun
  description: Sunrun-specific operations on the /api-sunrun namespace.
- name: Sunrun Sites
  description: Sunrun site asset inventory.
- name: Sunrun System Setup
  description: Sunrun energy-management and aPower switch control.
paths:
  /api-common/tokenizer:
    post:
      tags:
      - Authentication
      summary: Update Token
      operationId: tokenizer
      description: Fetch token by using CK CP
      security: []
      responses:
        '200':
          description: Envelope response. Non-zero `code` values (401 wrong token, 403 missing token or token param) are returned
            inside the envelope with HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '404':
          description: Unknown path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
