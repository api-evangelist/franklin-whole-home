                  type: integer
                  description: Cycle period of Circuit 3. All parameter descriptions refer to sw1
                sw3TimeEn:
                  type: integer
                  description: Circuit 3 timing plan. All parameter descriptions refer to sw1
                sw3Time:
                  type: array
                  items:
                    type: integer
