                sw1MsgType:
                  type: integer
                  description: 'Operation type. 1 : Manual switch 2 : Parameter settings'
                sw1SocLowSet:
                  type: integer
                  description: 'SOC threshold to shed loads on circuit 1. 0~100；0 : No limit … 100 : Turn off immediately
                    after disconnecting from the grid'
                sw1Mode:
                  type: integer
                  description: 'Circuit 1 operation. 0 : Manually turn off 1: Manually turn on, 2 :Timing plan'
                sw1ProLoad:
                  type: integer
                  description: 'Circuit 1 status. 0: Off  1:On'
                sw1Freq:
                  type: integer
                  description: 'Cycle period of Circuit 1. 0 : Single  1: Daily 2 : Weekly 3: Monthly'
                sw1TimeEn:
                  type: array
                  items:
                    type: integer
                  description: 'Circuit 1 timing plan. [0, 1]  0: Disabled 1: Enabled'
