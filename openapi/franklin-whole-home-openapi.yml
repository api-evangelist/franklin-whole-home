        required: false
        schema:
          type: string
        description: Site name
      - name: userAccount
        in: query
        required: false
        schema:
          type: string
        description: User account
      - name: deviceId
        in: query
        required: false
        schema:
          type: string
        description: Device ID
      - name: current
        in: query
        required: false
        schema:
          type: integer
        description: Current page. Start the query from page 1 and upload the page number that need to be queried. Defaults
          to the first page if not posted
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
        description: Display quantity per page. Number of data returned by the current page when queried. The default number
