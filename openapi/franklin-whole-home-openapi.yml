  /api-common/setTouProfile:
    post:
      tags:
      - System Settings
      summary: Set TOU Profile
      operationId: setTouProfile
      description: Set energy TOU profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                  description: Device id
                touId:
                  type: integer
                  description: TOU profile ID
                season:
                  type: array
                  items:
                    type: object
                  description: TOU profile season
              required:
              - deviceId
              - touId
              - season
            example:
              deviceId: 10080008B00A22150090
              touId: 10688
              season:
              - month: 5,6,7,8,9,10
                dayType: 1
                time:
                - startTime: 00:00
                  endTime: 08:00
                  waveType: 0
                  schedule: 8
                - startTime: 08:00
                  endTime: '21:00'
                  waveType: 1
                  schedule: 2
                - startTime: '21:00'
                  endTime: 08:00
                  waveType: 2
                  schedule: 1
              - month: 5,6,7,8,9,10
                dayType: 1
                time:
                - startTime: 00:00
                  endTime: 08:00
                  waveType: 0
                  schedule: 8
                - startTime: 08:00
                  endTime: '21:00'
                  waveType: 1
                  schedule: 2
                - startTime: '21:00'
                  endTime: 08:00
                  waveType: 2
                  schedule: 1
      responses:
        '200':
          description: Envelope response. Non-zero `code` values (401 wrong token, 403 missing token or token param) are returned
            inside the envelope with HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '404':
