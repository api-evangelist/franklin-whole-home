                  type: integer
                  description: Circuit 2 timing plan. All parameter descriptions refer to sw1
                sw2Time:
                  type: array
                  items:
                    type: integer
                  description: Circuit 2 time period. All parameter descriptions refer to sw1
                sw3Name:
                  type: string
                  description: Circuit 3 naming. All parameter descriptions refer to sw1
                sw3MsgType:
                  type: integer
                  description: Operation type. All parameter descriptions refer to sw1
                sw3SocLowSet:
                  type: integer
                  description: SOC threshold to shed loads on circuit 3. All parameter descriptions refer to sw1
