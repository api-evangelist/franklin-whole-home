aid: franklin-whole-home
name: Franklin Whole Home
description: 'Franklin Whole Home (FranklinWH Energy Storage Inc.) builds whole-home
  energy management and storage hardware for residential solar: the aPower lithium
  iron phosphate AC battery, the aGate energy management and controller unit, and the
  FranklinWH mobile app, together forming an ecosystem that coordinates solar, battery,
  grid, generator and EV power sources for backup, self-consumption, time-of-use arbitrage
  and off-grid operation. Founded in 2019 and headquartered in the San Francisco Bay
  Area, the company designs and manufactures nearly all of its own components and sells
  through a certified installer and distributor channel. FranklinWH publishes a partner
  API - a unified developer access platform for authorised third-party owners, financiers,
  installers and service providers to read device and site data, monitor system performance,
  receive operational alerts and perform approved remote device control.'
