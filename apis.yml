apis:
- aid: franklin-whole-home:franklinwh-api
  name: FranklinWH API
  description: 'The FranklinWH partner API - a unified developer access platform for
    authorised partners to connect to FranklinWH systems. Thirty-eight operations across
    a standard namespace (/api-common/) covering sites, device inventory, device parameters
    and running status, power/energy/telemetry data, historical warnings and backup
    events, time-of-use profiles, aPower switch control, smart circuits, grid events,
    device grouping and a modification audit log; plus a Sunrun-specific namespace
    (/api-sunrun/). Token authentication: a cp/ck credential pair is exchanged at
    /api-common/tokenizer for a token sent in the Authorization header.'
